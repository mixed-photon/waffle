[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waffle-eda"
dynamic = ["version"]
description = "Component, model, and simulation foundation for photonic design."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.5,<2.6", "pydantic>=2.13.4,<2.14"]

[project.optional-dependencies]
gdsfactory = ["gdsfactory==9.51.0"]
beamz = ["beamz==0.6.2"]

[project.scripts]
waffle = "waffle.apps.cli.main:main"

[tool.hatch.version]
path = "waffle/__init__.py"

# Bazel sources live in top-level `apps/`; an installed release exposes them as `waffle.apps`.
# force-include ignores `exclude`, so list app files explicitly (no tests, no BUILD files).
[tool.hatch.build.targets.wheel]
packages = ["waffle", "third_party"]
exclude = [
  "**/*_test.py", "**/BUILD.bazel", "**/*.bzl", "**/__pycache__/**",
  "third_party/**/requirements.*", "third_party/**/README.md",
  "third_party/gdsfactory/fixtures.py",
]

[tool.hatch.build.targets.wheel.force-include]
"apps/cli/main.py" = "waffle/apps/cli/main.py"
"apps/cli/lifecycle.py" = "waffle/apps/cli/lifecycle.py"
